<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <!-- 홈 히어로 — 소개 페이지 상단 배너 (2026-08-24 시안 첨부 그라디언트 재현).
       연한 블루 바탕 + 좌하 블루 · 우상 그린 · 우중 아쿠아 · 중좌 핑크 헤이즈 + 흰 원호 광선. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbe8fb"/>
      <stop offset="0.55" stop-color="#e6effc"/>
      <stop offset="1" stop-color="#dfedf8"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="120"/>
    </filter>
    <filter id="line" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="620" fill="url(#base)"/>

  <!-- 좌하 블루 -->
  <ellipse cx="120" cy="620" rx="560" ry="380" fill="#6f9ff0" opacity="0.68" filter="url(#softer)"/>
  <ellipse cx="40" cy="360" rx="380" ry="300" fill="#9dbef6" opacity="0.55" filter="url(#softer)"/>
  <!-- 우상 그린 -->
  <ellipse cx="1560" cy="30" rx="440" ry="320" fill="#c5eec0" opacity="0.85" filter="url(#softer)"/>
  <!-- 우중 아쿠아 -->
  <ellipse cx="1600" cy="420" rx="400" ry="320" fill="#b2e6ec" opacity="0.7" filter="url(#softer)"/>
  <!-- 중좌 핑크 헤이즈 -->
  <ellipse cx="560" cy="400" rx="440" ry="230" fill="#f0d9ec" opacity="0.5" filter="url(#soft)"/>
  <!-- 중앙 밝은 코어 -->
  <ellipse cx="760" cy="200" rx="560" ry="300" fill="#f4f9ff" opacity="0.55" filter="url(#softer)"/>

  <!-- 우측 세로 광선 (넓은 글로우) -->
  <path d="M 1420 -60 C 1330 200 1330 420 1440 700" fill="none" stroke="#ffffff" stroke-width="70" opacity="0.28" filter="url(#glow)"/>

  <!-- 얇은 흰 원호 라인 -->
  <path d="M -80 560 C 420 380 980 330 1660 430" fill="none" stroke="#ffffff" stroke-width="2.4" opacity="0.65" filter="url(#line)"/>
  <path d="M 60 -80 C 30 260 220 520 640 700" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" filter="url(#line)"/>
  <path d="M 1430 -80 C 1340 180 1345 420 1460 700" fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.7" filter="url(#line)"/>

  <!-- 전체 흰 베일 -->
  <rect width="1600" height="620" fill="#ffffff" opacity="0.04"/>
</svg>
